<!-- Specialties list page with data table and CRUD action buttons -->
<div>
  <h2 class="pc-page-title">Specialties</h2>

  <div class="pc-card">
    <div class="overflow-x-auto">
      <table id="specialties" class="pc-table">
        <thead>
        <tr>
          <th>Name</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let specialty of specialties">
          <td class="font-medium text-gray-800">{{ specialty.name }}</td>
          <td>
            <div class="flex gap-2">
              <button class="pc-btn-secondary text-xs" (click)="showEditSpecialtyComponent(specialty)">
                <span class="material-icons mr-1 text-sm">edit</span> Edit
              </button>
              <button class="pc-btn-danger text-xs" (click)="deleteSpecialty(specialty)">
                <span class="material-icons mr-1 text-sm">delete</span> Delete
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <!-- Page-level action buttons -->
    <div class="flex gap-3 mt-4 pt-4 border-t border-gray-100">
      <button *ngIf="isSpecialitiesDataReceived" class="pc-btn-secondary" (click)="gotoHome()">
        <span class="material-icons mr-2 text-lg">home</span>
        Home
      </button>
      <button *ngIf="isSpecialitiesDataReceived" class="pc-btn-primary" (click)="showAddSpecialtyComponent()">
        <span class="material-icons mr-2 text-lg">add</span>
        Add
      </button>
    </div>
  </div>
</div>

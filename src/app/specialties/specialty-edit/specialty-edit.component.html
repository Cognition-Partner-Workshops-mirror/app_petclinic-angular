<!-- Edit specialty form with pre-populated name field and validation -->
<div>
  <h2 class="pc-page-title">Edit Specialty</h2>
  <div class="pc-card max-w-md">
    <form (ngSubmit)="onSubmit(specialtyForm.value)" #specialtyForm="ngForm">
      <div>
        <input type="hidden" [(ngModel)]="specialty.id" name="id"/>
        <label for="name" class="pc-label">Name</label>
        <input type="text" class="pc-input" id="name" [(ngModel)]="specialty.name" name="name"
               required #name="ngModel"
               [class.pc-input-success]="name.dirty && name.valid"
               [class.pc-input-error]="name.dirty && !name.valid"/>
        <span class="pc-error" *ngIf="name.dirty && name.hasError('required')">Name is required</span>
      </div>

      <!-- Form action buttons -->
      <div class="flex gap-3 mt-8 pt-6 border-t border-gray-100">
        <button class="pc-btn-secondary" type="button" (click)="onBack()">
          <span class="material-icons mr-2 text-lg">arrow_back</span>
          Back
        </button>
        <button class="pc-btn-primary" type="submit" [disabled]="!specialtyForm.valid">
          <span class="material-icons mr-2 text-lg">save</span>
          Update
        </button>
      </div>
    </form>
  </div>
</div>

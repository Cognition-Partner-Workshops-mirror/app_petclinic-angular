<!-- Add new pet form with owner display, name, birth date picker, and type selector -->
<div>
  <h2 class="pc-page-title">Add Pet</h2>
  <div class="pc-card max-w-2xl">
    <form (ngSubmit)="onSubmit(petForm.value)" #petForm="ngForm">
      <div class="space-y-5">
        <input type="hidden" [(ngModel)]="pet.id" name="id"/>
        <input type="hidden" [(ngModel)]="pet.owner" name="owner"/>

        <!-- Read-only owner name display -->
        <div>
          <label for="owner_name" class="pc-label">Owner</label>
          <input id="owner_name" name="owner_name" class="pc-input bg-gray-50" type="text"
                 value="{{ currentOwner.firstName }} {{ currentOwner.lastName }}" readonly/>
        </div>

        <!-- Pet name field with alphanumeric pattern validation -->
        <div>
          <label for="name" class="pc-label">Name</label>
          <input id="name" name="name" class="pc-input" type="text" [(ngModel)]="pet.name"
                 minlength="1" maxlength="30" pattern="^[A-Za-z0-9].{0,29}$" required
                 #name="ngModel"
                 [class.pc-input-success]="name.dirty && name.valid"
                 [class.pc-input-error]="name.dirty && !name.valid"
                 placeholder="Enter pet name"/>
          <span class="pc-error" *ngIf="name.dirty && name.hasError('required')">Name is required</span>
          <span class="pc-error" *ngIf="name.dirty && name.hasError('minlength')">Name must be at least 1 character long</span>
          <span class="pc-error" *ngIf="name.dirty && name.hasError('maxlength')">Name may be at most 30 character long</span>
          <span class="pc-error" *ngIf="name.dirty && name.hasError('pattern')">Name must begin with a letter</span>
        </div>

        <!-- Birth date field using Angular Material datepicker component -->
        <div>
          <label class="pc-label">Birth Date</label>
          <div class="flex items-center gap-2">
            <input matInput [matDatepicker]="birthDateDatepicker" required
                   [ngModel]="pet.birthDate | date:'yyyy-MM-dd'"
                   name="birthDate" #birthDate="ngModel" class="pc-input"
                   [class.pc-input-success]="birthDate.dirty && birthDate.valid"
                   [class.pc-input-error]="birthDate.dirty && !birthDate.valid"/>
            <mat-datepicker-toggle matSuffix [for]="birthDateDatepicker"></mat-datepicker-toggle>
            <mat-datepicker #birthDateDatepicker></mat-datepicker>
          </div>
          <span class="pc-error" *ngIf="birthDate.dirty && birthDate.hasError('required')">BirthDate is required</span>
        </div>

        <!-- Pet type dropdown selector -->
        <div>
          <label for="type" class="pc-label">Type</label>
          <select id="type" name="type" class="pc-input" required [(ngModel)]="pet.type" #type="ngModel"
                  [class.pc-input-success]="type.dirty && type.valid"
                  [class.pc-input-error]="type.dirty && !type.valid">
            <option *ngFor="let type of petTypes" [ngValue]="type">{{ type.name }}</option>
          </select>
          <span class="pc-error" *ngIf="type.dirty && type.hasError('required')">pettype is required</span>
        </div>
      </div>

      <!-- Form action buttons -->
      <div class="flex gap-3 mt-8 pt-6 border-t border-gray-100">
        <button class="pc-btn-secondary" type="button" (click)="gotoOwnerDetail()">
          <span class="material-icons mr-2 text-lg">arrow_back</span>
          Back
        </button>
        <button class="pc-btn-primary" type="submit" [disabled]="!petForm.valid">
          <span class="material-icons mr-2 text-lg">save</span>
          Save Pet
        </button>
      </div>
    </form>
  </div>
</div>

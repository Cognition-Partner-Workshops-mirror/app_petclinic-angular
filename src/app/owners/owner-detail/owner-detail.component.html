<!-- Owner detail page showing owner info, action buttons, and associated pets/visits -->
<div>
  <h2 class="pc-page-title">Owner Information</h2>

  <!-- Owner info card with key-value detail rows -->
  <div class="pc-card mb-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Name</p>
        <p class="text-gray-800 font-medium ownerFullName">{{ owner.firstName }} {{ owner.lastName }}</p>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Telephone</p>
        <p class="text-gray-800">{{ owner.telephone }}</p>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Address</p>
        <p class="text-gray-800">{{ owner.address }}</p>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">City</p>
        <p class="text-gray-800">{{ owner.city }}</p>
      </div>
    </div>

    <!-- Owner action buttons -->
    <div class="flex flex-wrap gap-3 mt-6 pt-6 border-t border-gray-100">
      <button class="pc-btn-secondary" (click)="gotoOwnersList()">
        <span class="material-icons mr-2 text-lg">arrow_back</span>
        Back
      </button>
      <button class="pc-btn-primary" (click)="editOwner()">
        <span class="material-icons mr-2 text-lg">edit</span>
        Edit Owner
      </button>
      <button class="pc-btn-primary" (click)="addPet(owner)">
        <span class="material-icons mr-2 text-lg">add</span>
        Add New Pet
      </button>
    </div>
  </div>

  <!-- Pets and visits section rendered via child component -->
  <h2 class="pc-page-title">Pets and Visits</h2>
  <div class="space-y-4">
    <app-pet-list *ngFor="let pet of owner.pets" [pet]="pet"></app-pet-list>
  </div>
</div>

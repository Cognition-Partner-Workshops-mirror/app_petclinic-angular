<!-- Owner search page with search form and results table -->
<div>
  <h2 class="pc-page-title">Owners</h2>

  <!-- Search form card with last name filter -->
  <div class="pc-card mb-6">
    <form method="get" id="search-owner-form">
      <div class="flex flex-col sm:flex-row gap-4 items-end">
        <div class="flex-1">
          <label class="pc-label" for="lastName">Last name</label>
          <input class="pc-input" id="lastName" name="lastName" [(ngModel)]="lastName"
                 placeholder="Search by last name..." maxlength="80"/>
        </div>
        <button type="submit" class="pc-btn-primary" (click)="searchByLastName(lastName)">
          <span class="material-icons mr-2 text-lg">search</span>
          Find Owner
        </button>
      </div>
    </form>
  </div>

  <!-- No results message -->
  <div *ngIf="!owners" class="pc-card text-center py-8">
    <span class="material-icons text-4xl text-gray-300 mb-2">search_off</span>
    <p class="text-gray-500">No owners with last name starting with "{{lastName}}"</p>
  </div>

  <!-- Owners results table in a card container -->
  <div class="pc-card" id="ownersTable" *ngIf="owners">
    <!-- Responsive table wrapper for horizontal scroll on small screens -->
    <div class="overflow-x-auto">
      <table class="pc-table">
        <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th class="hidden sm:table-cell">City</th>
          <th class="hidden md:table-cell">Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let owner of owners">
          <td>
            <a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
               (click)="onSelect(owner)"
               class="text-blue-600 hover:text-blue-800 font-medium no-underline hover:underline ownerFullName">
              {{ owner.firstName }} {{ owner.lastName }}
            </a>
          </td>
          <td class="text-gray-600">{{ owner.address }}</td>
          <td class="text-gray-600 hidden sm:table-cell">{{ owner.city }}</td>
          <td class="text-gray-600 hidden md:table-cell">{{ owner.telephone }}</td>
          <td>
            <!-- Pet name badges displayed as small chips -->
            <span *ngFor="let pet of owner.pets"
                  class="inline-block bg-blue-50 text-blue-700 text-xs font-medium px-2 py-0.5 rounded-full mr-1 mb-1">
              {{ pet.name }}
            </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="mt-4 pt-4 border-t border-gray-100">
      <button *ngIf="isOwnersDataReceived" class="pc-btn-primary" (click)="addOwner()">
        <span class="material-icons mr-2 text-lg">person_add</span>
        Add Owner
      </button>
    </div>
  </div>
</div>

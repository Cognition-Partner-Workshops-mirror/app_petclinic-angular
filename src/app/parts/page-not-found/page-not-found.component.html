<!-- 404 error page with centered layout and navigation back to home -->
<div class="text-center py-16">
  <div class="text-6xl font-bold text-gray-300 mb-4">404</div>
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Page Not Found</h1>
  <p class="text-gray-500 mb-8">The page you're looking for doesn't exist.</p>
  <div class="pc-card max-w-sm mx-auto mb-8">
    <img class="mx-auto rounded-lg max-w-full h-auto" src="./assets/images/pets.png" alt="pets logo"/>
  </div>
  <a routerLink="/welcome" class="pc-btn-primary">
    <span class="material-icons mr-2 text-lg">home</span>
    Go Home
  </a>
</div>
